<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Nexus Metal</title>
  <desc id="desc">Logo Nexus Metal avec engrenage, monogramme NM et torche de soudage</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#101c31"/>
      <stop offset=".62" stop-color="#030914"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".18" stop-color="#cbd1d7"/>
      <stop offset=".43" stop-color="#fff"/>
      <stop offset=".67" stop-color="#7c828a"/>
      <stop offset="1" stop-color="#e9edf1"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset=".35" stop-color="#6b7280"/>
      <stop offset=".52" stop-color="#dbe4ec"/>
      <stop offset="1" stop-color="#272e39"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45e5ff"/>
      <stop offset=".34" stop-color="#159fe1"/>
      <stop offset=".68" stop-color="#1065cc"/>
      <stop offset="1" stop-color="#073886"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a48"/>
      <stop offset=".35" stop-color="#ccecff"/>
      <stop offset=".48" stop-color="#fff"/>
      <stop offset=".66" stop-color="#28c8ff"/>
      <stop offset="1" stop-color="#183b77"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".15" stop-color="#fff9ba"/>
      <stop offset=".38" stop-color="#ffae24"/>
      <stop offset=".72" stop-color="#1a78ff" stop-opacity=".65"/>
      <stop offset="1" stop-color="#1a78ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#000" flood-opacity=".9"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#000"/>
  <circle cx="500" cy="455" r="365" fill="url(#bg)" stroke="url(#ring)" stroke-width="15"/>
  <circle cx="500" cy="455" r="340" fill="none" stroke="#081a34" stroke-width="14"/>
  <circle cx="500" cy="455" r="305" fill="none" stroke="url(#steelDark)" stroke-width="9"/>
  <!-- engrenage -->
  <g transform="translate(500 455)" fill="url(#steel)" stroke="#f8fafc" stroke-width="3">
    <path d="M-286-35h50l12-43-43-23 32-57 45 20 31-33-22-44 57-33 28 42 43-12 4-50h66l4 50 43 12 28-42 57 33-22 44 31 33 45-20 32 57-43 23 12 43h50v70h-50l-12 43 43 23-32 57-45-20-31 33 22 44-57 33-28-42-43 12-4 50h-66l-4-50-43-12-28 42-57-33 22-44-31-33-45 20-32-57 43-23-12-43h-50z" fill-rule="evenodd"/>
    <circle r="222" fill="url(#bg)" stroke="#768294" stroke-width="12"/>
  </g>
  <path d="M294 326c51-72 125-112 210-112 90 0 171 44 220 118" fill="none" stroke="url(#steel)" stroke-width="12" stroke-linecap="round"/>
  <!-- NM -->
  <g filter="url(#shadow)" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-style="italic">
    <text x="203" y="570" font-size="330" fill="none" stroke="#02050a" stroke-width="34">N</text>
    <text x="203" y="570" font-size="330" fill="url(#steel)" stroke="#fff" stroke-width="5">N</text>
    <text x="453" y="570" font-size="330" fill="none" stroke="#02050a" stroke-width="34">M</text>
    <text x="453" y="570" font-size="330" fill="url(#blue)" stroke="#80e8ff" stroke-width="5">M</text>
  </g>
  <!-- torche -->
  <g transform="translate(710 400) rotate(-37)" filter="url(#shadow)">
    <rect x="0" y="0" width="275" height="54" rx="24" fill="#111827" stroke="#454d5b" stroke-width="7"/>
    <path d="M25 4h42v46H25zM79 4h26v46H79zM119 4h33v46h-33zM166 5h43v44h-43z" fill="#030712" stroke="#596273" stroke-width="4"/>
    <path d="M-92 13H14v28H-92l-50-14z" fill="url(#steelDark)" stroke="#d9e0e8" stroke-width="5"/>
    <path d="M-141 22l-61 5 61 7z" fill="#dce7f1"/>
  </g>
  <!-- étincelle -->
  <g transform="translate(658 650)" filter="url(#glow)">
    <circle r="73" fill="url(#spark)"/>
    <g stroke-linecap="round">
      <path d="M0-8L-13-128M7-4L91-99M11 3l133-18M7 10l99 78M0 11l9 128M-8 8l-92 86M-12 0l-135-22M-7-8l-74-109" stroke="#ff9f1c" stroke-width="6"/>
      <path d="M0-3L51-146M5 0l146-71M5 5l132 61M0 6l-48 143M-6 4l-143 40M-6-3l-111-99" stroke="#4da3ff" stroke-width="3"/>
      <circle r="18" fill="#fff"/>
    </g>
  </g>
  <!-- cartouche texte -->
  <path d="M77 670h846v149H77z" fill="#01040a" stroke="#101b2f" stroke-width="8"/>
  <g font-family="Arial Black, Impact, sans-serif" font-size="112" font-weight="900" font-style="italic" filter="url(#shadow)">
    <text x="94" y="782" fill="url(#steel)">NEXUS</text>
    <text x="512" y="782" fill="url(#blue)">METAL</text>
  </g>
  <path d="M126 835h748" stroke="url(#blue)" stroke-width="8" filter="url(#glow)"/>
  <path d="M242 840l258 91 258-91-258 125z" fill="#0b1c3b" stroke="url(#ring)" stroke-width="8"/>
</svg>
